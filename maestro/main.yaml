# The main parent flows for the demo parent (one child, Sam, no plan): Home,
# the child's page, the paywall and its creator code field, the sample
# dashboard a closed paywall leads to, Connect without a plan, Activity,
# Account, Updates, Delete account (opened, never confirmed) and sign out.
# Every step takes a screenshot, so a layout problem shows up even when
# nothing fails.
#
# iOS has no system back for Maestro: every way out is the screen's own
# control ("Back" in a native header, "Close", "I’ll finish later").
appId: ${APP_ID}
---
- runFlow:
    file: sign-in.yaml
    env:
      EMAIL: ${REVIEW_EMAIL}
      PASSWORD: ${REVIEW_PASSWORD}
- takeScreenshot: 03-home

# The child's page, and the paywall from its plan card.
- scrollUntilVisible:
    element: "Sam"
    direction: DOWN
    timeout: 15000
- tapOn: "Sam"
- waitForAnimationToEnd
- takeScreenshot: 04-child
- scrollUntilVisible:
    element: "See plans|Choose a TeenCue plan"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    text: "See plans|Choose a TeenCue plan"
    optional: true
- extendedWaitUntil:
    visible: "Sam.s plan is ready"
    timeout: 30000
    optional: true
- takeScreenshot: 05-paywall
- scroll
- takeScreenshot: 06-paywall-terms
- tapOn:
    text: 'Have a creator code\?'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 07-paywall-creator-code
- scroll
- takeScreenshot: 08-paywall-links

# Closing the paywall: the sample dashboard, with a way back to the plans.
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible: "Go to TeenCue"
    timeout: 15000
- takeScreenshot: 09-sample-dashboard
- tapOn: "Go to TeenCue"
- extendedWaitUntil:
    visible: "Home, your family"
    timeout: 15000

# Connect without a plan: the Subscribe card, and "I’ll finish later" back Home.
- scrollUntilVisible:
    element: "Finish setup"
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn:
    text: "Finish setup"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 10-connect-first-device
- tapOn:
    text: "I.ll finish later"
    optional: true
- extendedWaitUntil:
    visible: "Home, your family"
    timeout: 15000
- tapOn:
    text: "Add Sam.s (iPhone or iPad|computer)"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 11-connect-other-device
- tapOn:
    text: "I.ll finish later"
    optional: true

# Activity and Account.
- tapOn: "Activity, recent AI use"
- takeScreenshot: 12-activity
- tapOn: "Account, plan and settings"
- takeScreenshot: 13-account
- scrollUntilVisible:
    element: "Heads-up and weekly brief"
    direction: DOWN
    timeout: 15000
- tapOn: "Heads-up and weekly brief"
- waitForAnimationToEnd
- takeScreenshot: 14-updates
- tapOn: "Back"
- scrollUntilVisible:
    element: "Delete account"
    direction: DOWN
- tapOn: "Delete account"
- waitForAnimationToEnd
- takeScreenshot: 15-delete-account
- tapOn: "Back"

# Sign out.
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- tapOn: "Sign out"
- tapOn:
    text: "Sign out"
    optional: true
- extendedWaitUntil:
    visible: "TeenCue|TEENCUE"
    timeout: 20000
- takeScreenshot: 16-signed-out
