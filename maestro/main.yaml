# The main parent flows for the demo parent (one teen, Sam, no plan): Home,
# the teen page, the paywall, pairing, Activity, Account, Updates, Delete
# account (opened, never confirmed) and sign out. Every step takes a
# screenshot, so a layout problem shows up even when nothing fails.
appId: ${APP_ID}
---
- runFlow:
    file: sign-in.yaml
    env:
      EMAIL: ${REVIEW_EMAIL}
      PASSWORD: ${REVIEW_PASSWORD}
- takeScreenshot: 03-home

# The teen page, and the paywall from its plan card.
- tapOn: "Sam"
- waitForAnimationToEnd
- takeScreenshot: 04-teen
- scrollUntilVisible:
    element: "See plans|Choose a TeenCue plan"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    text: "See plans|Choose a TeenCue plan"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 05-paywall
- scroll
- takeScreenshot: 06-paywall-terms
- scroll
- takeScreenshot: 07-paywall-links
- back

# Pairing, from Home.
- tapOn: "Home, your family"
- tapOn:
    text: "Add .*computer|Finish setup"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 08-pairing-computer
- back
- tapOn:
    text: "Add .*iPhone.*|Set up their iPhone.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 09-pairing-iphone
- back

# Activity and Account.
- tapOn: "Activity, recent AI use"
- takeScreenshot: 10-activity
- tapOn: "Account, plan and settings"
- takeScreenshot: 11-account
- tapOn: "Heads-up and weekly brief"
- waitForAnimationToEnd
- takeScreenshot: 12-updates
- back
- scrollUntilVisible:
    element: "Delete account"
    direction: DOWN
- tapOn: "Delete account"
- waitForAnimationToEnd
- takeScreenshot: 13-delete-account
- back

# Sign out.
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- tapOn: "Sign out"
- tapOn:
    text: "Sign out"
    optional: true
- extendedWaitUntil:
    visible: "Get started"
    timeout: 20000
- takeScreenshot: 14-signed-out
