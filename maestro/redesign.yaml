# Before/after screenshots for the calm pass (teencue-mobile 63303ef).
# Every teen-mode screen and every loading state, opened by deep link.
# `?shot=` and /gallery work only in a screenshot build (EXPO_PUBLIC_SCREENSHOT_GALLERY).
# Skeletons pulse forever, so waits are fixed pauses, never waitForAnimationToEnd.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- openLink: "teencue://teen-device/welcome"
- extendedWaitUntil:
    visible: "__never__"
    timeout: 2500
    optional: true
- takeScreenshot: t01-welcome
- tapOn:
    text: "This is my own (iPhone|iPad)"
    optional: true
- extendedWaitUntil:
    visible: "__never__"
    timeout: 1500
    optional: true
- takeScreenshot: t01b-welcome-own-device
- openLink: "teencue://teen-device/code"
- extendedWaitUntil:
    visible: "__never__"
    timeout: 2500
    optional: true
- takeScreenshot: t02-code-scan
- tapOn:
    text: "Enter a code instead"
    optional: true
- extendedWaitUntil:
    visible: "__never__"
    timeout: 1500
    optional: true
- takeScreenshot: t04-code-typing
- hideKeyboard:
    optional: true
- openLink: "teencue://teen-device/code?shot=connecting"
- extendedWaitUntil:
    visible: "__never__"
    timeout: 2500
    optional: true
- takeScreenshot: t03-code-connecting
