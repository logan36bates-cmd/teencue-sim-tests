# Sign in from a fresh install. EMAIL and PASSWORD come from the caller's env.
# Works at every text size: at the largest one the buttons are below the fold.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible: "TeenCue|TEENCUE"
    timeout: 60000
- scrollUntilVisible:
    element: "Get started"
    direction: DOWN
    # At AX5 on the iPhone SE the Welcome copy is long: 20 s was not enough (run 6).
    timeout: 60000
    # At AX5 the button sat in full view and 100% still failed (run 2).
    # Centring it failed everywhere (run 3): it is pinned and cannot move.
    visibilityPercentage: 50
- takeScreenshot: 01-welcome
- scrollUntilVisible:
    element: "Already have an account.*"
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn: "Sign in"
- extendedWaitUntil:
    # At AX5 the focused email field scrolls the title away (run 5).
    visible: "Welcome back|Email"
    timeout: 15000
- takeScreenshot: 02-sign-in
- tapOn: "you@example.com"
- inputText: ${EMAIL}
# Return on the email field moves to the password. On an iPhone SE the
# keyboard covers the password field, and a tap on it typed the password
# into the email (run 2).
- pressKey: Enter
- inputText: ${PASSWORD}
# The password field's return key is "Go": it signs in. Tapping the button
# after closing the keyboard raced the sign-in it had already started.
- pressKey: Enter
# iOS offers to save the password once per install, sometimes only after
# Home is up, and Home cannot be read while the sheet covers it.
- extendedWaitUntil:
    visible: "Not Now|Finish setting up.*|Home, your family"
    timeout: 30000
    optional: true
# On the iPads the sheet arrived a few seconds after Home (run 6), so it is
# dismissed for as long as Home cannot be read.
- repeat:
    while:
      notVisible: "Home, your family"
    times: 15
    commands:
      - tapOn:
          text: "Not Now"
          optional: true
      # On the iPad Pro 13 the sheet is drawn outside the app and Maestro
      # cannot read it (run 8), so Not Now is tapped where it sits. Below
      # the sheet, that spot on Home is empty.
      - runFlow:
          when:
            true: ${DEVICE == 'ipad-pro-13'}
          commands:
            - tapOn:
                point: "43%,57%"
      # The iPad Air 11 too (28 Oct), upright and sideways: where Not Now
      # sits in each. Below the sheet, both spots on Home are empty.
      - runFlow:
          when:
            true: ${DEVICE == 'ipad-air-11' && (typeof ORIENT == 'undefined' || ORIENT != 'landscape')}
          commands:
            - tapOn:
                point: "41%,59%"
      - runFlow:
          when:
            true: ${DEVICE == 'ipad-air-11' && typeof ORIENT != 'undefined' && ORIENT == 'landscape'}
          commands:
            - tapOn:
                point: "44%,62%"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Home, your family"
    timeout: 30000
