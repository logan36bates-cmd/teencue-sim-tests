# Sign in from a fresh install. EMAIL and PASSWORD come from the caller's env.
# Works at every text size: at the largest one the buttons are below the fold.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible: "TeenCue|TEENCUE"
    timeout: 60000
- scrollUntilVisible:
    element: "Get started"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 01-welcome
- scrollUntilVisible:
    element: "Already have an account.*"
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- takeScreenshot: 02-sign-in
- tapOn: "you@example.com"
- inputText: ${EMAIL}
- tapOn: "Your password"
- inputText: ${PASSWORD}
# The password field's return key is "Go": it signs in. Tapping the button
# after closing the keyboard raced the sign-in it had already started.
- pressKey: Enter
# iOS offers to save the password once per install.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Home, your family"
    timeout: 30000
- tapOn:
    text: "Not Now"
    optional: true
