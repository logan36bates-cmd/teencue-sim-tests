# Installs an iOS simulator build from EAS on iPad and iPhone simulators and
# walks the main flows with Maestro, at the default text size and the largest
# accessibility size. The screenshots are encrypted before upload, kept 1 day.
#
# Manual only: it never runs for pull requests, so a fork cannot reach the
# secrets. Secrets: EXPO_TOKEN (a Viewer robot), REVIEW_EMAIL, REVIEW_PASSWORD,
# ARTIFACT_KEY. No secret value is ever echoed.
name: Simulator screens

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build ID of the iOS simulator build
        required: true
      intel:
        description: Use the Intel macOS runners (the arm64 pool is sometimes full)
        type: boolean
        default: true
      submission:
        description: App Store screenshots only (iPad Pro 13 and iPhone 17 Pro Max, default text size, no landscape)
        type: boolean
        default: false
      flows:
        description: Flows to run instead of onboarding and main, e.g. "redesign main" (blank for the usual)
        type: string
        default: ''
      device:
        description: Only this device, by slug (ipad-pro-13, iphone-17-pro-max, iphone-17-pro, ipad-air-11, ipad-mini, iphone-se); blank for all
        type: string
        default: ''
      to_recipient:
        description: Encrypt the screenshots to scripts/recipient.pem (a public key; its private half stays on the owner's machine) instead of ARTIFACT_KEY
        type: boolean
        default: false
      device_log:
        description: Also keep the app's own device log with the screenshots, encrypted the same way
        type: boolean
        default: false
      sizes:
        description: Text sizes, e.g. "large" for the default only (blank for default and the largest)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Picks the devices: all five, the two App Store sizes for a submission
  # run, or the one named in "device".
  pick:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          SUBMISSION: ${{ inputs.submission }}
          DEVICE: ${{ inputs.device }}
          ALL: '[{"image":"macos-26","device":"iPad Pro 13-inch (M5)","slug":"ipad-pro-13","ipad":true},{"image":"macos-26","device":"iPhone 17 Pro Max","slug":"iphone-17-pro-max","ipad":false},{"image":"macos-26","device":"iPhone 17 Pro","slug":"iphone-17-pro","ipad":false},{"image":"macos-26","device":"iPad Air 11-inch (M4)","slug":"ipad-air-11","ipad":true},{"image":"macos-26","device":"iPad mini (A17 Pro)","slug":"ipad-mini","ipad":true},{"image":"macos-15","device":"iPhone SE (3rd generation)","slug":"iphone-se","ipad":false}]'
        run: |
          set -euo pipefail
          m="$ALL"
          if [ "$SUBMISSION" = true ]; then m=$(jq -c '.[:2]' <<<"$m"); fi
          if [ -n "$DEVICE" ]; then m=$(jq -c --arg d "$DEVICE" 'map(select(.slug == $d))' <<<"$m"); fi
          if [ "$(jq length <<<"$m")" = 0 ]; then echo "No device matches '$DEVICE'" >&2; exit 1; fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  screens:
    needs: pick
    strategy:
      fail-fast: false
      # The two App Store sizes (13" iPad, 6.9" iPhone) come first; a
      # submission run stops there.
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.matrix) }}
    runs-on: ${{ inputs.intel && format('{0}-intel', matrix.image) || matrix.image }}
    timeout-minutes: 120
    env:
      APP_ID: com.teencue.mobile
      REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
      REVIEW_PASSWORD: ${{ secrets.REVIEW_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Download the simulator build from EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          if ! [[ "$BUILD_ID" =~ ^[0-9a-f-]{36}$ ]]; then echo "build_id must be an EAS build UUID" >&2; exit 1; fi
          query=$(python3 -c 'import json,sys; print(json.dumps({"query": "query($id: ID!) { builds { byId(buildId: $id) { status platform artifacts { buildUrl } } } }", "variables": {"id": sys.argv[1]}}))' "$BUILD_ID")
          url=$(curl -fsS https://api.expo.dev/graphql \
            -H "Authorization: Bearer $EXPO_TOKEN" -H 'Content-Type: application/json' \
            --data "$query" | python3 -c '
          import json, sys
          b = json.load(sys.stdin)["data"]["builds"]["byId"]
          if b["status"] != "FINISHED" or b["platform"] != "IOS":
              sys.exit("The build is %s on %s, not a finished iOS build" % (b["status"], b["platform"]))
          print(b["artifacts"]["buildUrl"])')
          # A signed download link: never shown in the public log.
          echo "::add-mask::$url"
          curl -fsSL "$url" -o app.tar.gz
          mkdir -p app && tar -xzf app.tar.gz -C app
          app=$(find app -maxdepth 4 -name '*.app' -type d | head -n 1)
          if [ -z "$app" ]; then echo "No .app in the build" >&2; exit 1; fi
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
      - name: Create and boot the simulator
        run: scripts/sim.sh boot "${{ matrix.device }}"
      - name: Install the app
        run: xcrun simctl install booted "$APP_PATH"
      - name: Walk the flows at each text size
        env:
          SIZES: ${{ inputs.submission && 'large' || inputs.sizes }}
          LANDSCAPE: ${{ inputs.submission && 'false' || 'true' }}
          RETRY: ${{ inputs.submission && '1' || '0' }}
          FLOWS: ${{ inputs.flows }}
          DEVICE_LOG: ${{ inputs.device_log && '1' || '0' }}
        run: scripts/sim.sh walk "${{ matrix.slug }}" "${{ matrix.ipad }}"
      - name: Encrypt the screenshots
        if: always()
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
          TO_RECIPIENT: ${{ inputs.to_recipient && '1' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p screens
          tar -czf screens.tgz screens
          if [ "$TO_RECIPIENT" = 1 ]; then
            # A fresh random key for this file, sealed with the public key: only the private half opens it.
            openssl rand -hex 32 > file.key
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
              -pass file:file.key -in screens.tgz -out "screens-${{ matrix.slug }}.tgz.enc"
            openssl pkeyutl -encrypt -pubin -inkey scripts/recipient.pem \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
              -in file.key -out "screens-${{ matrix.slug }}.key.enc"
            rm -f file.key
          else
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
              -pass env:ARTIFACT_KEY -in screens.tgz -out "screens-${{ matrix.slug }}.tgz.enc"
          fi
          rm -f screens.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.slug }}
          path: screens-${{ matrix.slug }}.*.enc
          retention-days: 1
          if-no-files-found: error
